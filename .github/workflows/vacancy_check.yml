name: Vacancy Check

on:
  schedule:
    - cron: '0 0 * * 0' # Sundays at 00:00 UTC
  workflow_dispatch: # Allow manual trigger

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: Verify push permission
        run: |
          echo "Token permissions as reported by the API (unreliable for bot tokens):"
          gh api repos/${{ github.repository }} --jq '.permissions' || true
          # .permissions is documented for user tokens and can read false for
          # the Actions bot even when push works, so prove write access by
          # pushing and deleting a throwaway branch — the same credentials
          # path the commit step uses.
          probe="ci/token-write-probe-${{ github.run_id }}"
          if git push origin "HEAD:refs/heads/$probe"; then
            git push origin --delete "$probe" || true
            echo "Token has push access"
          else
            echo "::error::GITHUB_TOKEN cannot push to this repository. Go to Settings → Actions → General → Workflow permissions and select 'Read and write permissions'."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: playwright install chromium

      - name: Run Vacancy Engine
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m src.main

      - name: Commit and Push State
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          if git diff --cached --quiet; then
            echo "No changes to vacancy state; nothing to commit or push"
            exit 0
          fi
          git commit -m "Update vacancy state [skip ci]"
          git push origin main
