name: Vacancy Check

on:
  schedule:
    - cron: '0 0 * * 0' # Sundays at 00:00 UTC
  workflow_dispatch: # Allow manual trigger

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: Verify push permission
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh api repos/${{ github.repository }} --jq '.permissions.push')" != "true" ]; then
            echo "::error::GITHUB_TOKEN cannot push to this repository. Go to Settings → Actions → General → Workflow permissions and select 'Read and write permissions'."
            exit 1
          fi
          echo "Token has push access"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: playwright install chromium

      - name: Run Vacancy Engine
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m src.main

      - name: Commit and Push State
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          if git diff --cached --quiet; then
            echo "No changes to vacancy state; nothing to commit or push"
            exit 0
          fi
          git commit -m "Update vacancy state [skip ci]"
          git push origin main
